<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#0F2A3B"/>
  <rect x="24" y="24" width="464" height="464" rx="84" fill="#163A4F" opacity="0.6"/>
  <g>
    <!-- row 1 -->
